<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;width:100vw;height:100vh;overflow:hidden}
.w{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
.c{width:var(--s);height:var(--s);border-radius:50%;border:calc(var(--s)*0.018) solid #C9A961;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}
.m{font-family:Georgia,'Times New Roman',serif;color:#C9A961;font-size:calc(var(--s)*0.46);line-height:1;letter-spacing:-0.02em;margin-top:calc(var(--s)*0.04)}
.y{font-family:'Segoe UI',Arial,sans-serif;color:#F5F5F2;font-size:calc(var(--s)*0.085);letter-spacing:0.32em;margin-top:calc(var(--s)*0.03);padding-left:0.32em}
</style></head>
<body><div class="w"><div class="c" id="c"><div class="m">M</div><div class="y">2030</div></div></div>
<script>
const p=new URLSearchParams(location.search);const k=parseFloat(p.get('k')||'0.78');
document.getElementById('c').style.setProperty('--s',(Math.min(innerWidth,innerHeight)*k)+'px');
</script></body></html>
